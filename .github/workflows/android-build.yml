name: Android Build (fork)

# Manual trigger only while this port is still being stabilized.
# Run it from the Actions tab (or `gh workflow run android-build.yml`).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android (aarch64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs the Android SDK. The NDK is fetched separately below because
      # Tauri needs a specific NDK version range — bump the version string
      # here if `tauri android init` complains about an unsupported NDK.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      # `ring` (a rustls dependency) compiles native assembly at build time
      # via cc-rs, which needs a real C compiler for the target — the NDK
      # ships one, but nothing points cc-rs at it by default. This sets the
      # per-target CC/AR/linker env vars for all 4 Android ABIs so `cargo
      # check`/`cargo build` can find it for the rest of the job.
      - name: Configure NDK toolchain env
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$BIN" >> "$GITHUB_PATH"
          {
            echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android24-clang"
            echo "CXX_aarch64_linux_android=$BIN/aarch64-linux-android24-clang++"
            echo "AR_aarch64_linux_android=$BIN/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android24-clang"
            echo "CC_armv7_linux_androideabi=$BIN/armv7a-linux-androideabi24-clang"
            echo "CXX_armv7_linux_androideabi=$BIN/armv7a-linux-androideabi24-clang++"
            echo "AR_armv7_linux_androideabi=$BIN/llvm-ar"
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$BIN/armv7a-linux-androideabi24-clang"
            echo "CC_i686_linux_android=$BIN/i686-linux-android24-clang"
            echo "CXX_i686_linux_android=$BIN/i686-linux-android24-clang++"
            echo "AR_i686_linux_android=$BIN/llvm-ar"
            echo "CARGO_TARGET_I686_LINUX_ANDROID_LINKER=$BIN/i686-linux-android24-clang"
            echo "CC_x86_64_linux_android=$BIN/x86_64-linux-android24-clang"
            echo "CXX_x86_64_linux_android=$BIN/x86_64-linux-android24-clang++"
            echo "AR_x86_64_linux_android=$BIN/llvm-ar"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$BIN/x86_64-linux-android24-clang"
            echo "ANDROID_NDK_HOME=$NDK"
            echo "NDK_HOME=$NDK"
          } >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: harbor-core check
        working-directory: harbor-core
        run: cargo check

      # Fast feedback: this alone will surface most Rust compile errors
      # (missing cfg gates, leftover desktop-only references, etc) in a
      # couple of minutes, without waiting for the full Gradle/APK build.
      - name: Rust check for aarch64-linux-android
        working-directory: src-tauri
        run: cargo check --target aarch64-linux-android

      - name: Init Android project (first run only)
        run: pnpm tauri android init

      - name: Tauri Android build (debug APK)
        run: pnpm tauri android build --debug --target aarch64

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: harbor-android-debug
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 14
          if-no-files-found: error
