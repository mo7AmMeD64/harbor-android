name: Android Build (fork)

# Manual trigger only while this port is still being stabilized.
# Run it from the Actions tab (or `gh workflow run android-build.yml`).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android (aarch64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs the Android SDK. The NDK is fetched separately below because
      # Tauri needs a specific NDK version range — bump the version string
      # here if `tauri android init` complains about an unsupported NDK.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: harbor-core check
        working-directory: harbor-core
        run: cargo check

      # Fast feedback: this alone will surface most Rust compile errors
      # (missing cfg gates, leftover desktop-only references, etc) in a
      # couple of minutes, without waiting for the full Gradle/APK build.
      - name: Rust check for aarch64-linux-android
        working-directory: src-tauri
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: cargo check --target aarch64-linux-android

      - name: Init Android project (first run only)
        run: pnpm tauri android init
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973

      - name: Tauri Android build (debug APK)
        run: pnpm tauri android build --debug --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: harbor-android-debug
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 14
          if-no-files-found: error
