[package]
name = "harbor"
version = "0.9.21"
description = "A Stremio client built for adventure"
edition = "2021"

[lib]
name = "harbor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# NOTE (Android fork): "tray-icon" moved to the desktop-only target block below
# because the tray module/feature isn't relevant on mobile.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-process = "2"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = [
  "stream",
  "multipart",
  "json",
  "gzip",
  "hickory-dns",
] }
flate2 = "1"
encoding_rs = "0.8"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
base64 = "0.22"
hound = "3.5"
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
] }
harbor-core = { path = "../harbor-core" }
librqbit = { version = "=8.1.1", default-features = false, features = ["rust-tls"] }
url = "2"
hickory-resolver = "0.25"

# ---------------------------------------------------------------------------
# Desktop-only dependencies (Windows / Linux / macOS).
# These back the native mpv player, tray icon, Discord Rich Presence, window
# state persistence, Chromecast/AirPlay discovery, subtitle-sync audio
# fingerprinting, and process-memory reporting — none of which are used (or
# buildable) on Android in this fork. cfg(not(target_os = "android")) keeps
# desktop builds (Win/Linux/macOS) working exactly as before.
# ---------------------------------------------------------------------------
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
libmpv2 = "4"
libmpv2-sys = "4"
libc = "0.2"
png = "0.17"
discord-rich-presence = "1.1"
rust_cast = { path = "vendor/rust_cast", version = "0.20" }
mdns-sd = "0.13"
realfft = "3"
# reqwest's system-OpenSSL TLS backend. Fine on desktop where OpenSSL is
# installed on the build machine; NOT used on Android (see below) because
# there's no cross-compiled OpenSSL for aarch64-linux-android in CI.
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

# ---------------------------------------------------------------------------
# Android-only: reqwest needs a TLS backend, but "native-tls" (OpenSSL) can't
# cross-compile here without a prebuilt Android OpenSSL sysroot (this is what
# broke the first CI run — see README-ANDROID.md). rustls is a pure-Rust TLS
# implementation with no native library to cross-compile, and the project
# already depends on it directly (see [dependencies] above) plus librqbit
# already uses it via the "rust-tls" feature, so this fits the existing setup.
# ---------------------------------------------------------------------------
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation",
  "Win32_System_LibraryLoader",
] }
window-vibrancy = "0.6"
wasapi = "0.15"
webview2-com = "0.38"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.dev]
debug = "line-tables-only"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
  "NSGeometry",
  "NSThread",
  "NSValue",
  "NSDictionary",
  "NSString",
] }
objc2-app-kit = { version = "0.3", features = [
  "NSWindow",
  "NSView",
  "NSOpenGL",
  "NSOpenGLView",
  "NSResponder",
] }
objc2-web-kit = { version = "0.3", features = ["WKWebView"] }
core-foundation = "0.10"
core-video = "0.4"
